name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Selena Hub APK
        run: bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: selena-hub-apk
          path: app/selena-hub.apk

      - name: Publish latest APK download release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Selena Hub Android" --notes "Official Selena Hub Android APK"
          gh release upload android-latest app/selena-hub.apk --clobber
